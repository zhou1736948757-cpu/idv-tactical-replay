# Rate limit zone for replay ZIP uploads: 3 requests/minute per client IP
limit_req_zone $binary_remote_addr zone=idv_upload_limit:10m rate=3r/m;

server {
    listen 80;
    listen [::]:80;
    http2 on;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Compression (explicitly includes 3D GLB binaries & API/static JSON)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        text/javascript
        text/css
        text/plain
        image/svg+xml
        font/woff2
        model/gltf-binary;

    # Baseline security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Never cache SPA entry HTML so deployments take effect immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # 1 year immutable cache on content-hashed Vite bundle assets
    location ~* ^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    # 7d + SWR cache & byte-range support on optimized 3D map GLBs
    location ~* ^/assets/maps-3d/.+\.glb$ {
        types {
            model/gltf-binary glb;
        }
        default_type model/gltf-binary;
        add_header Accept-Ranges "bytes" always;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # 1d cache on unhashed static assets (2D map grids, portraits, dossier textures, nav-grids)
    location /assets/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Rate-limited streaming ZIP upload endpoint
    location = /api/replays/upload {
        limit_req zone=idv_upload_limit burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 256m;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://backend:8000;
    }

    # Backend REST API reverse proxy
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_pass http://backend:8000;
    }

    # Vue SPA client-side fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
