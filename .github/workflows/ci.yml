name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend Pytest & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend & test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Run backend pytest suite
        run: python -m pytest -p no:asyncio backend/tests -v

  frontend:
    name: Renderer & Frontend Typecheck, Vitest, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install, test & build @idv/replay-renderer
        run: |
          npm --prefix packages/replay-renderer ci
          npm --prefix packages/replay-renderer run typecheck
          npm --prefix packages/replay-renderer test
          npm --prefix packages/replay-renderer run build

      - name: Install, typecheck, test & build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run typecheck
          npm --prefix frontend test
          npm --prefix frontend run build
