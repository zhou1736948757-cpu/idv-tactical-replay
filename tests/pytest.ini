[pytest]
# Root full-stack E2E suite (live uvicorn + Vite preview + headless Chromium/Edge).
# `-p no:asyncio`: the machine-wide pytest-asyncio is incompatible with pytest 7.4.4 and
# crashes before collection; these tests are synchronous (same fix as backend/pytest.ini).
# `-p no:base_url`/`no:playwright`: we drive Playwright directly (own browser/channel choice).
addopts = -p no:asyncio -p no:playwright -p no:base_url
testpaths = .
markers =
    e2e: live full-stack end-to-end test (boots real backend + frontend processes)
    browser: real headless browser test
